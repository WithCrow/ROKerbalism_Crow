// --------------------------------------------------------
// Shenzhou
// --------------------------------------------------------
@PART[KCHS_SZ_OrbitalModule]:NEEDS[FeatureHabitat]:AFTER[zzzKerbalism]
{
    @MODULE[Habitat]
    {
        %volume = 15.0
        %surface = 30.0
    }

    MODULE
    {
        name = ProcessController
        resource = _Scrubber
        title = Scrubber
        capacity = 3.0
        running = true
    }

    MODULE
    {
        name = ProcessController
        resource = _PressureControl
        title = N2 Pressure Control
        capacity = 0.43 // (30 / 70)
        running = true
    }
}

@PART[KCHS_SZ_Re_entryModule]:NEEDS[FeatureHabitat]:AFTER[zzzKerbalism]
{
    @MODULE[Habitat]
    {
        %volume = 6.0
        %surface = 18.0
    }

    MODULE
    {
        name = ProcessController
        resource = _Scrubber
        title = Scrubber
        capacity = 3.0
        running = true
    }

    MODULE
    {
        name = ProcessController
        resource = _PressureControl
        title = N2 Pressure Control
        capacity = 0.26 // (18 / 70)
        running = true
    }
}