// --------------------------------------------------------
// VentureStar
// --------------------------------------------------------
@PART[Mk33Cockpit]:NEEDS[RealismOverhaul,FeatureHabitat]:AFTER[zzzKerbalism]
{
    @MODULE[Habitat]
    {
        %volume = 32.0
        %surface = 56.0
    }

    MODULE
    {
        name = ProcessController
        resource = _Scrubber
        title = Scrubber
        capacity = 8.0
        running = true
    }

    MODULE
    {
        name = ProcessController
        resource = _PressureControlOxygen
        title = O2 Pressure Control
        capacity = 0.8 // (56 / 70)
        running = true
    }
}