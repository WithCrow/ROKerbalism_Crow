
@PART[bluedog_Gemini_1p5mShortSegment|bluedog_Gemini_OneRoomStationModule|bluedog_Gemini_TwoRoomStationModule|bluedog_Gemini_InflatableAirlock|bluedog_GeminiFerry_PressurizedModule|bluedog_MOL_1p5mStationSegment|bluedog_MOL_Lab_New|bluedog_MOL_Airlock|bluedog_MiniLab_Lab]:NEEDS[Bluedog_DB,ProfileRealismOverhaul]:AFTER[RealismOverhaul]
{
  %capsuleScrubbers = true
  %scrubberCapacity = 1.67

  MODULE
  {
    name = ProcessController
    resource = _PressureControlOxygen
    title = O2 Pressure Controller
    desc = Use <b>Oxygen</b> to maintain the internal atmosphere at a comfortable pressure.
    capacity = 1.67
    toggle = true
    running = true
  }

  @MODULE[ProcessController],*
  {
    @capacity *= #$/CrewCapacity$
  }
}

@PART[bluedog_Gemini_1p5mShortSegment]:NEEDS[Bluedog_DB,FeatureHabitat]:AFTER[zzzKerbalism]
{
  @MODULE[Habitat]
  {
    %volume = 2.26
    %surface = 11.07
    %max_pressure = 0.35
  }
}
